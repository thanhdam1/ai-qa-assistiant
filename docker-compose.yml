version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_qa_qdrant
    ports:
      - "6333:6333" # REST API & Web UI Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  # Backend FastAPI Service (Optional containerized mode)
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: ai_qa_backend
  #   ports:
  #     - "8000:8000"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - qdrant

volumes:
  qdrant_storage:
    driver: local
