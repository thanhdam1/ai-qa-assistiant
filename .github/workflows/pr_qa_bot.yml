name: AI QA PR Impact Analysis Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze_pr_impact:
    name: Analyze Codebase Impact & Suggest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Git Diff
        id: git_diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "DIFF_FILE=pr_diff.txt" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & Run Impact Analysis
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pip install -r backend/requirements.txt
          python -c "
          import sys, os
          sys.path.insert(0, 'backend')
          from app.api.v1.pr_bot import analyze_pr_diff, PRAnalyzeRequest
          
          with open('pr_diff.txt', 'r', encoding='utf-8') as f:
              diff_content = f.read()

          req = PRAnalyzeRequest(
              pr_title=os.environ['PR_TITLE'],
              pr_number=int(os.environ['PR_NUMBER']),
              git_diff=diff_content
          )
          res = analyze_pr_diff(req)
          with open('pr_comment.md', 'w', encoding='utf-8') as out:
              out.write(res.markdown_comment)
          "

      - name: Post Comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('pr_comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
