openapi: 3.0.3
info:
  title: Clinic Appointment API
  version: 1.0.0
  description: Sample contract for reviewing clinic appointment workflows. Example only; not a live API.
servers:
  - url: https://api.example.test/v1
    description: Example server; do not send requests to it.
security:
  - BearerAuth: []
paths:
  /clinics/{clinicId}/availability:
    get:
      operationId: searchAvailability
      summary: Search available appointment slots
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - name: from
          in: query
          required: true
          description: Inclusive start timestamp with an explicit UTC offset.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Inclusive end timestamp with an explicit UTC offset.
          schema:
            type: string
            format: date-time
        - name: providerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: serviceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matching available slots
          content:
            application/json:
              schema:
                type: object
                required: [slots]
                properties:
                  slots:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppointmentSlot'
        '400':
          description: Invalid date range or query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication is required or invalid
        '403':
          description: The caller is not authorized to access this clinic
  /appointments:
    post:
      operationId: bookAppointment
      summary: Book an available appointment slot
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional key supplied by the client for a booking request.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequest'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          description: Request is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication is required or invalid
        '403':
          description: The caller is not authorized to book for this clinic
        '409':
          description: The requested slot is no longer available; response body is unspecified
        '422':
          description: Request fields failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /appointments/{appointmentId}:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    get:
      operationId: getAppointment
      summary: Get an appointment
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '401':
          description: Authentication is required or invalid
        '403':
          description: The caller cannot access this appointment
        '404':
          description: Appointment does not exist
    patch:
      operationId: rescheduleAppointment
      summary: Reschedule an appointment to another slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleAppointmentRequest'
      responses:
        '200':
          description: Appointment rescheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          description: Request is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication is required or invalid
        '403':
          description: The caller cannot reschedule this appointment
        '404':
          description: Appointment does not exist
        '409':
          description: The requested replacement slot is unavailable or appointment cannot be changed
        '422':
          description: Request fields failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /appointments/{appointmentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    post:
      operationId: cancelAppointment
      summary: Cancel an appointment
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAppointmentRequest'
      responses:
        '204':
          description: Appointment cancelled
        '400':
          description: Cancellation request is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication is required or invalid
        '403':
          description: The caller cannot cancel this appointment
        '404':
          description: Appointment does not exist
        '409':
          description: Appointment cannot be cancelled under the current rules
  /clinics/{clinicId}/appointments:
    get:
      operationId: listClinicAppointments
      summary: List appointments for a clinic
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: pageToken
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: A page of clinic appointments
          content:
            application/json:
              schema:
                type: object
                required: [items, nextPageToken]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  nextPageToken:
                    type: string
                    nullable: true
        '400':
          description: Query parameters are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication is required or invalid
        '403':
          description: The caller is not authorized to access this clinic
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    ClinicId:
      name: clinicId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    AppointmentStatus:
      type: string
      enum: [confirmed, cancelled, completed]
    AppointmentSlot:
      type: object
      required: [clinicId, providerId, serviceId, startsAt, endsAt]
      properties:
        clinicId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    BookAppointmentRequest:
      type: object
      required: [clinicId, providerId, serviceId, startsAt]
      properties:
        clinicId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        patientId:
          type: string
          format: uuid
          description: Must be ignored if supplied; patient identity comes from the access token.
        notes:
          type: string
          maxLength: 1000
    RescheduleAppointmentRequest:
      type: object
      required: [newStartsAt]
      properties:
        newStartsAt:
          type: string
          format: date-time
    CancelAppointmentRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
        cancelledByStaff:
          type: boolean
          description: Client-supplied role indicator; authorization must come from the access token.
    Appointment:
      type: object
      required:
        [id, clinicId, providerId, serviceId, patientId, startsAt, endsAt, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
