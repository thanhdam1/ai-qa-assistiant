server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Access Control (HTTP Basic Auth cho Staging Public)
  # Để bật bảo vệ mật khẩu, bỏ comment 2 dòng dưới và mount file .htpasswd vào /etc/nginx/.htpasswd:
  # auth_basic "Restricted Access - QA Assistant Staging";
  # auth_basic_user_file /etc/nginx/.htpasswd;

  # Reverse proxy cho API Backend (Hỗ trợ Same-Origin, triệt tiêu lỗi CORS trên Staging)
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  # Single Page Application routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
